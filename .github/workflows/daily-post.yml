name: ENB News Auto Updater

on:
  schedule:
    - cron: '0 * * * *' # الكود هيشتغل أوتوماتيك كل ساعة
  workflow_dispatch: # الخيار ده بيخليك تقدر تشغل الأكشن يدوي في أي وقت

permissions:
  contents: write # أهم سطر عشان الأكشن يقدر يضيف الأخبار للموقع

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Auto Writer Script
        env:
          # هنا ربطنا الـ Secrets اللي إنت عملتها بالكود
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: node auto-writer.js

      - name: Save and Upload Changes
        run: |
          git config --global user.name "ENB-Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          # السطر ده عشان لو مفيش أخبار جديدة نزلت الأكشن ميفشلش
          git commit -m "Update News Feed [Automated]" || echo "No changes to commit"
          git push
